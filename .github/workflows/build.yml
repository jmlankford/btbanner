name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio "esptool==4.8.1"
      - name: Build all environments
        run: pio run
      - name: Merge a single flashable binary (classic ESP32 / esp32dev)
        run: |
          set -e
          BUILD=.pio/build/esp32dev
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          echo "boot_app0: $BOOT_APP0"
          python -m esptool --chip esp32 merge_bin \
            -o esp32-ipixel-bridge-esp32dev-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  "$BUILD/bootloader.bin" \
            0x8000  "$BUILD/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin"
          # App-only image for over-the-air updates from the web UI.
          cp "$BUILD/firmware.bin" esp32-ipixel-bridge-esp32dev-ota.bin
          ls -l esp32-ipixel-bridge-esp32dev-merged.bin esp32-ipixel-bridge-esp32dev-ota.bin
      - name: Upload merged firmware (flash this at offset 0x0)
        uses: actions/upload-artifact@v4
        with:
          name: esp32dev-firmware
          path: |
            esp32-ipixel-bridge-esp32dev-merged.bin
            esp32-ipixel-bridge-esp32dev-ota.bin
          if-no-files-found: error
      - name: Publish firmware to a Release (stable download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-latest
          name: Latest firmware (flash at 0x0)
          body: |
            Classic ESP32 (ESP32-D0WD) firmware.

            First flash (over USB, once): flash
            esp32-ipixel-bridge-esp32dev-merged.bin at offset 0x0.

            Every flash after that (over the air, from the bridge's web page):
            upload esp32-ipixel-bridge-esp32dev-ota.bin on the Firmware update card.

            Direct links:
            merged (serial): https://github.com/jmlankford/btbanner/releases/latest/download/esp32-ipixel-bridge-esp32dev-merged.bin
            ota (web update): https://github.com/jmlankford/btbanner/releases/latest/download/esp32-ipixel-bridge-esp32dev-ota.bin
          files: |
            esp32-ipixel-bridge-esp32dev-merged.bin
            esp32-ipixel-bridge-esp32dev-ota.bin
