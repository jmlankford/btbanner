name: decode-backtrace
on:
  push:
    paths: ['.github/workflows/decode.yml']
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade platformio
      - name: Build esp32dev (same commit the device runs)
        run: pio run -e esp32dev
      - name: Decode the panic backtrace
        run: |
          A2L=$(find ~/.platformio/packages -name 'xtensa-esp32-elf-addr2line' | head -1)
          echo "using: $A2L"
          echo "===== DECODED BACKTRACE ====="
          "$A2L" -pfiaC -e .pio/build/esp32dev/firmware.elf \
            0x401990d3 0x4019911a 0x4019945f 0x401993be \
            0x400db094 0x400db10d 0x401b1159 \
            0x400f536a 0x400f540e 0x400f5b7a 0x400f6899 0x400f76c1 0x400f56d9 \
            0x400dbc16 0x400d442b 0x400fa701 \
            0x400837e5 0x40094179 0x40099c71
          echo "===== END ====="
