; PlatformIO project for the ESP32 iPixel Color BLE bridge.
;
;   pio run                 build every environment
;   pio run -e esp32-s3 -t upload   flash an ESP32-S3 dev board
;   pio run -e esp32dev -t upload   flash a classic ESP32 dev board
;   pio device monitor      watch the serial log (115200)
;
; NimBLE-Arduino is pinned to the 1.4.x API the firmware is written against;
; do not bump it to 2.x without updating ipixel.cpp (the scan/callback API changed).

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.3
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=2

; Primary target: ESP32-S3 has the headroom for BLE + Wi-Fi + web server.
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv

; Secondary target: classic ESP32. Uses a large-app partition because the
; BLE + Wi-Fi image does not fit the default layout.
[env:esp32dev]
board = esp32dev
board_build.partitions = huge_app.csv
