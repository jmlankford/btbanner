; PlatformIO project for the ESP32 iPixel Color BLE bridge.
;
;   pio run                 build every environment
;   pio run -e esp32-s3 -t upload   flash an ESP32-S3 dev board
;   pio run -e esp32dev -t upload   flash a classic ESP32 dev board
;   pio device monitor      watch the serial log (115200)
;
; Platform is pinned to espressif32 6.12.0 (Arduino-ESP32 core 2.0.17 / IDF 4.4).
; This MUST stay on the 2.x core: NimBLE-Arduino 1.4.x (below) only works on it.
; On core 3.x (IDF 5) NimBLE 1.4's esp_bt_controller_init aborts with
; ESP_ERR_INVALID_STATE at boot. To move to core 3.x you must also upgrade
; NimBLE-Arduino to 2.x and port ipixel.cpp (the scan/callback API changed).

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ~1.4.3
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; Initialize PSRAM at boot if the module has it (WROVER). Harmless on a
    ; WROOM (no PSRAM): init just fails quietly and psramFound() returns false.
    ; When present, the image/GIF buffer is placed in PSRAM, so GIFs can be far
    ; larger than the ~48 KB a no-PSRAM board can spare.
    -DBOARD_HAS_PSRAM

; min_spiffs.csv gives TWO ~1.9 MB app slots (OTA-capable). Our image is
; ~1.2 MB, so it fits with room, and the web OTA updater can write the spare
; slot. Switching from huge_app to this layout requires one more serial flash.
;
; Primary target: ESP32-S3 has the headroom for BLE + Wi-Fi + web server.
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv

; Secondary target: classic ESP32.
[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv
