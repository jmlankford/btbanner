# Mosquitto bridge: mirror the sign's topics to a cloud relay
# ---------------------------------------------------------------------------
# Use this when your MQTT broker is on your LAN but the sign is remote (on an
# isolated network it can't reach your LAN). Your local broker stays private
# and plaintext; this bridge forwards ONLY the ipixel/# topics to a small
# free cloud broker (TLS), which the sign connects to. Home Assistant keeps
# using your local broker unchanged.
#
# Home Assistant "Mosquitto broker" add-on:
#   1. Add-on Configuration -> set:
#        customize:
#          active: true
#          folder: mosquitto
#   2. Put this file at /share/mosquitto/ipixel_bridge.conf
#      (edit the token/host first), then Restart the add-on.
#
# Plain Mosquitto: drop this in your conf.d/ (or include it) and restart.
# ---------------------------------------------------------------------------

# --- flespi variant (token is the username, no password) -------------------
connection ipixel-flespi
address mqtt.flespi.io:8883
remote_username YOUR_FLESPI_TOKEN_HERE
bridge_capath /etc/ssl/certs/
bridge_insecure false
try_private false
cleansession true
notifications false
# Mirror both directions so commands reach the sign and status/ack come back.
topic ipixel/# both 0

# --- EMQX / other user+password broker variant -----------------------------
# Comment out the flespi block above and use this instead:
#
# connection ipixel-cloud
# address YOUR_CLOUD_HOST:8883
# remote_username YOUR_USERNAME
# remote_password YOUR_PASSWORD
# bridge_capath /etc/ssl/certs/
# bridge_insecure false
# try_private false
# cleansession true
# notifications false
# topic ipixel/# both 0
#
# If TLS verification fails (self-signed / odd CA), set: bridge_insecure true
